name: Build and Deploy ClothNear to Firebase

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Verify GitHub secret is set
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::GEMINI_API_KEY secret is empty. Set it under Settings → Secrets → Actions."
            exit 1
          fi

      # Bundled .env fallback for flutter_dotenv; primary path is --dart-define.
      - name: Create .env for Flutter asset bundle
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          printf 'GEMINI_API_KEY=%s\nGEMINI_MODEL=gemini-2.5-flash\n' "$GEMINI_API_KEY" > .env

      - name: Build web (compile API key into bundle)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          flutter build web --release \
            --dart-define=GEMINI_API_KEY="$GEMINI_API_KEY" \
            --dart-define=GEMINI_MODEL=gemini-2.5-flash \
            --dart-define=GEMINI_KEY_COMPILED=true

      - name: Verify compile-time define marker
        run: |
          if ! grep -q "GEMINI_KEY_COMPILED" build/web/main.dart.js; then
            echo "::error::Build missing GEMINI_KEY_COMPILED — dart-define was not applied."
            exit 1
          fi

      - name: Verify env asset exists in build output
        run: |
          ls -la build/web/assets/
          find build/web/assets -name '*env*' -o -name 'AssetManifest*' | head -20

      - name: Deploy to Firebase
        run: npx firebase-tools deploy --only hosting --project clothnear --token "${{ secrets.FIREBASE_TOKEN }}"
