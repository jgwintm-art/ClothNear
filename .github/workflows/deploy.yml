name: Build and Deploy ClothNear to Firebase

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Verify GitHub secret is set
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::GEMINI_API_KEY secret is empty. Set it under Settings → Secrets → Actions."
            exit 1
          fi

      - name: Create .env for Flutter asset bundle
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          printf 'GEMINI_API_KEY=%s\nGEMINI_MODEL=gemini-2.5-flash\n' "$GEMINI_API_KEY" > .env

      - name: Inject compile-time API secrets (primary for Flutter Web)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_SHA: ${{ github.sha }}
        run: python3 scripts/write_api_secrets.py

      - name: Verify api_secrets.dart before build
        run: |
          python3 -c "import pathlib; t=pathlib.Path('lib/config/api_secrets.dart').read_text(); assert 'geminiApiKey = ' in t and \"geminiApiKey = ''\" not in t and 'geminiApiKey = \"\"' not in t, 'api_secrets.dart was not injected'"

      - name: Install dependencies
        run: flutter pub get

      - name: Build web release
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          flutter build web --release \
            --dart-define=GEMINI_API_KEY="$GEMINI_API_KEY" \
            --dart-define=GEMINI_MODEL=gemini-2.5-flash \
            --dart-define=GEMINI_KEY_COMPILED=true \
            --dart-define=BUILD_ID="${{ github.sha }}"

      - name: Verify Gemini key is compiled into main.dart.js
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 scripts/verify_web_bundle.py

      - name: Deploy to Firebase
        run: npx firebase-tools deploy --only hosting --project clothnear --token "${{ secrets.FIREBASE_TOKEN }}"
