name: Build and Deploy ClothNear to Firebase

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Verify required secrets are set
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::GEMINI_API_KEY secret is empty. Set it under Settings → Secrets → Actions."
            exit 1
          fi
          if [ -z "${{ secrets.PAYMONGO_FUNCTIONS_BASE }}" ]; then
            echo "::warning::PAYMONGO_FUNCTIONS_BASE is not set. Online payments will be disabled."
          fi

      - name: Create .env for Flutter asset bundle
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PAYMONGO_FUNCTIONS_BASE: ${{ secrets.PAYMONGO_FUNCTIONS_BASE }}
        run: |
          printf 'GEMINI_API_KEY=%s\nGEMINI_MODEL=gemini-2.5-flash\nPAYMONGO_ENABLED=true\nPAYMONGO_FUNCTIONS_BASE=%s\n' \
            "$GEMINI_API_KEY" "$PAYMONGO_FUNCTIONS_BASE" > .env

      - name: Inject compile-time API secrets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PAYMONGO_SECRET_KEY: ""
        run: python3 scripts/write_api_secrets.py

      - name: Install dependencies
        run: flutter pub get

      - name: Build web release
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PAYMONGO_FUNCTIONS_BASE: ${{ secrets.PAYMONGO_FUNCTIONS_BASE }}
        run: |
          flutter build web --release \
            --pwa-strategy=none \
            --dart-define=GEMINI_API_KEY="$GEMINI_API_KEY" \
            --dart-define=GEMINI_MODEL=gemini-2.5-flash \
            --dart-define=PAYMONGO_ENABLED=true \
            --dart-define=PAYMONGO_FUNCTIONS_BASE="$PAYMONGO_FUNCTIONS_BASE"

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@15.18.0

      - name: Deploy to Firebase Hosting
        run: firebase deploy --only hosting --project clothnear --non-interactive --token "${{ secrets.FIREBASE_TOKEN }}"
